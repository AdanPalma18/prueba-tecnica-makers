version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: prestamos-postgres
    environment:
      POSTGRES_DB: prestamosdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prestamos123
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: